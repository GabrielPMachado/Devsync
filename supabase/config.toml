# Configuração do Supabase CLI para desenvolvimento local.
# Os valores omitidos usam os padrões do CLI. Rode `supabase start` para
# subir o banco local e `supabase test db` para os testes pgTAP.
project_id = "devsync"

[db]
major_version = 15

[db.seed]
enabled = false

[api]
# Só o que o site usa.
schemas = ["public", "graphql_public"]

[auth]
site_url = "http://localhost:3000"
# Porta 3100: servidor dos testes E2E.
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3100/**", "http://127.0.0.1:3000/**", "http://127.0.0.1:3100/**"]
enable_signup = true

[auth.rate_limit]
# Local: os testes E2E mandam vários e-mails seguidos.
email_sent = 100

[auth.email]
enable_confirmations = false
# Mesmo intervalo do botão "reenviar" da tela "Confira seu e-mail".
max_frequency = "1s"
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Seu link de acesso à Devsync"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Seu link de acesso à Devsync"
content_path = "./supabase/templates/confirmation.html"

[auth.external.github]
enabled = true
# Local: crie um app OAuth de teste e exporte as variáveis antes do `supabase start`.
# Sem elas o botão ainda leva ao GitHub, que recusa o client_id vazio.
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = ""
