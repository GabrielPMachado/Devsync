<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#070B14;font-family:Inter,Arial,sans-serif;color:#F8FAFC">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="max-width:440px;background:#0B1120;border:1px solid #1E293B;border-radius:24px;padding:40px">
            <tr><td style="font-size:22px;font-weight:800">Dev<span style="color:#22D3EE">sync</span></td></tr>
            <tr><td style="padding-top:24px;font-size:20px;font-weight:700">Seu link de acesso</td></tr>
            <tr><td style="padding-top:8px;font-size:15px;line-height:24px;color:#94A3B8">Toque no botão para entrar na Devsync. O link vale por 1 hora e só funciona uma vez.</td></tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#2563EB;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:8px">Entrar na Devsync</a>
              </td>
            </tr>
            <tr><td style="padding-top:24px;font-size:13px;line-height:20px;color:#64748B">Não pediu este e-mail? Pode ignorar. Ninguém entra na sua conta sem este link.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
