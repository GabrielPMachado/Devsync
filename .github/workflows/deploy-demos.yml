name: Publicar serviço de demos

# Roda só quando alguém clica em "Run workflow" (Actions > Publicar serviço de demos).
# Precisa, em Settings > Secrets and variables > Actions:
#   Variável DEMOS_DOMAIN               domínio das demos, ex.: devsyncdemos.com
#   Segredo  CLOUDFLARE_API_TOKEN       token com Workers, R2, Queues e Workers Routes
#   Segredo  CLOUDFLARE_ACCOUNT_ID      ID da conta Cloudflare
#   Segredo  SUPABASE_SERVICE_ROLE_KEY  chave service_role do Supabase
#   Segredo  UPLOAD_SIGNING_SECRET      `openssl rand -hex 32`
#   Segredo  SAFE_BROWSING_API_KEY      opcional
#   Variável BUILDER_REPO               opcional: repositório de builds (ex.: GabrielPMachado/devsync-builds)
#   Segredo  BUILDER_GITHUB_TOKEN       opcional: token fine-grained com Actions: write no BUILDER_REPO
# Passo a passo completo: docs/lancamento.md

on:
  workflow_dispatch:
    inputs:
      criar_recursos:
        description: "Criar bucket R2 e filas (só na primeira vez)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-demos
  cancel-in-progress: false

jobs:
  deploy:
    name: Testar e publicar o Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: workers/demos
    env:
      DEMOS_DOMAIN: ${{ vars.DEMOS_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/demos/package-lock.json

      - name: Conferir configuração
        env:
          HAS_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_SIGNING: ${{ secrets.UPLOAD_SIGNING_SECRET != '' }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ "$HAS_SERVICE_ROLE" = "true" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ "$HAS_SIGNING" = "true" ] || missing="$missing UPLOAD_SIGNING_SECRET"
          if ! printf '%s' "$DEMOS_DOMAIN" | grep -Eq '^[a-z0-9-]+(\.[a-z0-9-]+)+$'; then missing="$missing DEMOS_DOMAIN(válido)"; fi
          if [ -n "$missing" ]; then echo "::error::Falta configurar:$missing (veja docs/lancamento.md)"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Colocar o domínio na configuração
        run: sed -i "s/DOMINIO_DAS_DEMOS/$DEMOS_DOMAIN/g" wrangler.jsonc

      - name: Criar bucket e filas
        if: ${{ inputs.criar_recursos }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create devsync-demos || echo "bucket já existe"
          npx wrangler queues create demo-zips || echo "fila demo-zips já existe"
          npx wrangler queues create demo-links || echo "fila demo-links já existe"
          # Zips enviados e não concluídos somem depois de 1 dia.
          npx wrangler r2 bucket lifecycle add devsync-demos uploads-1-dia uploads/ --expire-days 1 --force || echo "regra de ciclo de vida já existe"

      # Código e segredos sobem juntos (--secrets-file): a API nunca fica no ar sem a
      # service_role e o segredo de assinatura. O arquivo fica fora do repositório e é apagado.
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
          SAFE_BROWSING_API_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
          BUILDER_GITHUB_TOKEN: ${{ secrets.BUILDER_GITHUB_TOKEN }}
          BUILDER_REPO: ${{ vars.BUILDER_REPO }}
        run: |
          secrets_file="$RUNNER_TEMP/demos-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            // BUILDER_REPO não é segredo, mas vai junto para não exigir outra publicação.
            const keys = ["SUPABASE_SERVICE_ROLE_KEY", "UPLOAD_SIGNING_SECRET", "SAFE_BROWSING_API_KEY", "BUILDER_GITHUB_TOKEN", "BUILDER_REPO"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
          ' "$secrets_file"
          npx wrangler deploy --env production --secrets-file "$secrets_file"

      - name: Conferir que está no ar
        run: |
          # DNS novo pode levar alguns minutos: tenta por até 5 minutos.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$DEMOS_DOMAIN/rota-que-nao-existe" || true)
            [ "$code" = "404" ] && break
            sleep 10
          done
          echo "Resposta da API: $code"
          [ "$code" = "404" ] || { echo "::error::A API não respondeu como esperado ($code). Confira a rota e o DNS curinga."; exit 1; }
