name: Publicar serviço de demos

# Roda sozinho quando entra na main uma mudança em workers/demos (ou neste arquivo),
# e também à mão em "Run workflow" (Actions > Publicar serviço de demos).
# Precisa, em Settings > Secrets and variables > Actions:
#   Variável WORKERS_SUBDOMAIN          subdomínio workers.dev da conta (plano grátis, demos em pastas),
#                                       ex.: devsync → devsync-demos.devsync.workers.dev
#   Variável DEMOS_DOMAIN               opcional: domínio próprio das demos (cada demo no seu subdomínio).
#                                       Se preenchida, ganha do WORKERS_SUBDOMAIN.
#   Segredo  CLOUDFLARE_API_TOKEN       token com Workers, R2, Queues e Workers Routes
#   Segredo  CLOUDFLARE_ACCOUNT_ID      ID da conta Cloudflare
#   Segredo  SUPABASE_SERVICE_ROLE_KEY  chave service_role do Supabase
#   Segredo  UPLOAD_SIGNING_SECRET      `openssl rand -hex 32`
#   Segredo  SAFE_BROWSING_API_KEY      opcional
#   Variável BUILDER_REPO               opcional: repositório de builds (ex.: GabrielPMachado/devsync-builds)
#   Variável BUILDER_REPO_ID            opcional: id numérico do BUILDER_REPO
#   Segredo  BUILDER_GITHUB_TOKEN       opcional: token fine-grained com Actions: write no BUILDER_REPO
#   Segredo  BROWSER_RENDERING_TOKEN    opcional: token da Cloudflare só com "Browser Rendering: Edit"
#                                       (liga o print automático das demos nos cards; cota grátis diária)
# Passo a passo completo: docs/lancamento.md

on:
  push:
    branches: [main]
    paths:
      - "workers/demos/**"
      - ".github/workflows/deploy-demos.yml"
  workflow_dispatch:
    inputs:
      criar_recursos:
        description: "Criar bucket R2 e filas (só na primeira vez)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-demos
  cancel-in-progress: false

jobs:
  deploy:
    name: Testar e publicar o Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: workers/demos
    env:
      DEMOS_DOMAIN: ${{ vars.DEMOS_DOMAIN }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/demos/package-lock.json

      - name: Conferir configuração
        env:
          HAS_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_SIGNING: ${{ secrets.UPLOAD_SIGNING_SECRET != '' }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ "$HAS_SERVICE_ROLE" = "true" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ "$HAS_SIGNING" = "true" ] || missing="$missing UPLOAD_SIGNING_SECRET"
          if [ -n "$DEMOS_DOMAIN" ]; then
            printf '%s' "$DEMOS_DOMAIN" | grep -Eq '^[a-z0-9-]+(\.[a-z0-9-]+)+$' || missing="$missing DEMOS_DOMAIN(válido)"
          else
            printf '%s' "$WORKERS_SUBDOMAIN" | grep -Eq '^[a-z0-9-]+$' || missing="$missing WORKERS_SUBDOMAIN(ou DEMOS_DOMAIN)"
          fi
          if [ -n "$missing" ]; then echo "::error::Falta configurar:$missing (veja docs/lancamento.md)"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Escolher o modo (domínio próprio ou workers.dev)
        run: |
          if [ -n "$DEMOS_DOMAIN" ]; then
            sed -i "s/DOMINIO_DAS_DEMOS/$DEMOS_DOMAIN/g" wrangler.jsonc
            echo "WRANGLER_ENV=production-domain" >> "$GITHUB_ENV"
            echo "DEMOS_HOST=$DEMOS_DOMAIN" >> "$GITHUB_ENV"
          else
            sed -i "s/SUBDOMINIO_WORKERS/$WORKERS_SUBDOMAIN/g" wrangler.jsonc
            echo "WRANGLER_ENV=production" >> "$GITHUB_ENV"
            echo "DEMOS_HOST=devsync-demos.$WORKERS_SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"
          fi

      - name: Criar bucket e filas
        if: ${{ inputs.criar_recursos }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create devsync-demos || echo "bucket já existe"
          npx wrangler queues create demo-zips || echo "fila demo-zips já existe"
          npx wrangler queues create demo-links || echo "fila demo-links já existe"
          # Zips enviados e não concluídos somem depois de 1 dia.
          npx wrangler r2 bucket lifecycle add devsync-demos uploads-1-dia uploads/ --expire-days 1 --force || echo "regra de ciclo de vida já existe"

      # Código e segredos sobem juntos (--secrets-file): a API nunca fica no ar sem a
      # service_role e o segredo de assinatura. O arquivo fica fora do repositório e é apagado.
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
          SAFE_BROWSING_API_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
          BUILDER_GITHUB_TOKEN: ${{ secrets.BUILDER_GITHUB_TOKEN }}
          BUILDER_REPO: ${{ vars.BUILDER_REPO }}
          BUILDER_REPO_ID: ${{ vars.BUILDER_REPO_ID }}
          BROWSER_RENDERING_TOKEN: ${{ secrets.BROWSER_RENDERING_TOKEN }}
        run: |
          secrets_file="$RUNNER_TEMP/demos-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            // BUILDER_REPO não é segredo, mas vai junto para não exigir outra publicação.
            const keys = ["SUPABASE_SERVICE_ROLE_KEY", "UPLOAD_SIGNING_SECRET", "SAFE_BROWSING_API_KEY", "BUILDER_GITHUB_TOKEN", "BUILDER_REPO", "BUILDER_REPO_ID", "BROWSER_RENDERING_TOKEN"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            // Print automático: a API REST do Browser Rendering precisa do ID da conta.
            if (out.BROWSER_RENDERING_TOKEN) out.CLOUDFLARE_ACCOUNT_ID = process.env.CLOUDFLARE_ACCOUNT_ID;
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
          ' "$secrets_file"
          npx wrangler deploy --env "$WRANGLER_ENV" --secrets-file "$secrets_file"

      - name: Conferir que está no ar
        run: |
          # DNS novo pode levar alguns minutos: tenta por até 5 minutos.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$DEMOS_HOST/rota-que-nao-existe" || true)
            [ "$code" = "404" ] && break
            sleep 10
          done
          echo "Resposta da API em https://$DEMOS_HOST: $code"
          echo "No site (Vercel): NEXT_PUBLIC_DEMOS_URL=https://$DEMOS_HOST" >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "404" ] || { echo "::error::A API não respondeu como esperado ($code). Confira a rota e o DNS curinga."; exit 1; }
