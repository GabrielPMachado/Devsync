name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Supabase local (Docker) para os testes do banco e o login nos E2E.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0

      - name: Subir o Supabase local
        env:
          # App OAuth falso: o E2E só confere o redirecionamento para o GitHub.
          SUPABASE_AUTH_GITHUB_CLIENT_ID: ci-client-id
          SUPABASE_AUTH_GITHUB_SECRET: ci-secret
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime

      - name: Testes do banco (pgTAP)
        run: supabase test db

      - name: Variáveis do site apontando para o Supabase local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_DEMOS_URL=http://demos.localhost:8787"
          } > .env.local

      # Serviço de demos local (wrangler dev) para o E2E de publicar com zip.
      - name: Serviço de demos para o E2E
        run: |
          npm ci --prefix workers/demos
          scripts/demos-dev-vars.sh

      - run: npm run build

      - name: Cache do navegador do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  demos:
    name: Serviço de demos (Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/demos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/demos/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  db:
    name: Banco (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Postgres 16 com pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl

      - run: scripts/test-db.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
